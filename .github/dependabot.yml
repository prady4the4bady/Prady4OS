# Dependabot version updates for PRADYOS.
#
# 2026-08-22 correction: the npm entry pointed at `/`, where there is no
# `package.json` — the project's only npm manifest is `tools/graph_mcp/`. So the
# npm half of this file had never scanned anything. `directory:` is a literal
# path, not a glob, so the fix is to name the real directory.
#
# NOTE for whoever triages the security alerts: version updates (this file) and
# security alerts are separate systems. Alerts come from the repository
# dependency graph and fire whether or not this file is correct, so fixing the
# path here does not by itself clear or explain any existing alert.
#
# Current dependency surface, for reference:
#   tools/graph_mcp/package-lock.json  — 97 packages; `npm audit` reports
#                                        0 vulnerabilities at every severity
#                                        (measured 2026-08-22).
#   tests/toolchain/hello_rs/Cargo.toml — no dependencies at all, so no cargo
#                                        ecosystem entry is warranted.
#   Dockerfile (repo root)             — FROM ubuntu:24.04.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/tools/graph_mcp"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/"          # the Dockerfile really is at the repo root
    schedule:
      interval: "weekly"

  # The CI workflows pin actions by major tag (actions/checkout@v5,
  # actions/setup-python@v5). Without this ecosystem Dependabot never proposes
  # bumps for them, and a major-tag pin silently absorbs whatever the action
  # owner pushes to that tag.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
